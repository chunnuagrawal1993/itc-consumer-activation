<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITC Consumer Activation - Promoter AI Screening</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <img src="itc-logo.jpg" alt="ITC Logo" class="logo">
    <h2>Promoter Assessment Portal</h2>
    <div class="nav-tabs">
      <button id="tab-promoter-btn" class="active" onclick="switchView('promoter')">Promoter Session</button>
      <button id="tab-admin-btn" onclick="switchView('admin')">Operations Admin</button>
    </div>
  </header>

  <main class="container">
    <!-- PROMOTER VIEW -->
    <section id="promoter-view" class="view-panel active">
      <div class="grid-2">
        <div class="card">
          <h3>1. Promoter Details & Script</h3>
          <label>Full Name</label>
          <input type="text" id="candidate-name" placeholder="Enter full name" value="Rohan Sharma">

          <label>Store & City</label>
          <input type="text" id="store-name" placeholder="e.g., Reliance Smart Bazaar - Andheri, Mumbai">

          <label>Spoken Language</label>
          <select id="stt-language">
            <option value="hi-IN" selected>Hindi (हिंदी)</option>
            <option value="en-IN">English (India)</option>
            <option value="ta-IN">Tamil (தமிழ்)</option>
            <option value="te-IN">Telugu (తెలుగు)</option>
            <option value="kn-IN">Kannada (ಕನ್ನಡ)</option>
            <option value="bn-IN">Bengali (বাংলা)</option>
            <option value="mr-IN">Marathi (मराठी)</option>
          </select>

          <label>Master Brand Spiel (Golden Script)</label>
          <textarea id="master-spiel" rows="3">Namaste! Kya aapne Sunfeast Dark Fantasy try kiya hai? Isme hai crispy chocolate cookie bahar se aur andar molten choco lava jo muh mein melt ho jata hai. Aaj Reliance mein Buy 2 Get 1 Free offer chal raha hai!</textarea>

          <label>Gemini API Key</label>
          <input type="password" id="gemini-api-key" placeholder="Enter Gemini API Key">
        </div>

        <div class="card">
          <h3>2. Live Camera & Real-Time Transcription</h3>
          <div class="video-wrapper">
            <div id="recording-badge" class="badge-rec">🔴 REC - Listening...</div>
            <video id="camera-preview" autoplay muted playsinline></video>
          </div>

          <div class="btn-group">
            <button id="start-record-btn" class="btn btn-start" onclick="startPromoterSession()">▶ Start Recording & Live STT</button>
            <button id="stop-record-btn" class="btn btn-stop" onclick="stopPromoterSession()" disabled>⏹ Stop Recording</button>
          </div>

          <label style="margin-top: 12px;">Live Streaming Transcript (Visible to Promoter):</label>
          <div id="live-transcript-box" class="transcript-display">
            <em>Your live speech transcript will appear here in real time...</em>
          </div>

          <button id="submit-eval-btn" class="btn btn-primary" onclick="submitForAssessment()" style="margin-top: 15px; width: 100%;">
            🚀 Submit Pitch for AI Screening
          </button>
        </div>
      </div>

      <!-- Evaluation Result Feedback -->
      <div id="evaluation-card" class="card result-card" style="display: none; margin-top: 20px;">
        <h3>AI Screening Verdict</h3>
        <div id="eval-content"></div>
      </div>
    </section>

    <!-- OPERATIONS ADMIN VIEW -->
    <section id="admin-view" class="view-panel">
      <div class="card">
        <div class="admin-header">
          <h3>Operations Admin Dashboard</h3>
          <button class="btn btn-outline" onclick="loadAdminDashboard()">🔄 Refresh Submissions</button>
        </div>
        <div id="admin-kpi-summary" class="kpi-grid"></div>
        <div id="admin-submissions-list" class="submissions-container"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
