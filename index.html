<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITC Consumer Activation - Promoter AI Screening</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAVBAR WITH STRICT LOGO SIZING -->
  <header class="navbar">
    <div class="nav-brand">
      <img src="itc-logo.jpg" alt="ITC Logo" class="brand-logo">
      <span class="brand-title">Promoter Assessment Portal</span>
    </div>
  </header>

  <main class="container">
    <div class="grid-layout">
      
      <!-- LEFT COLUMN: INPUT SETUP -->
      <div class="card">
        <h3>1. Evaluation Configuration</h3>

        <label for="candidate-name">Promoter Full Name</label>
        <input type="text" id="candidate-name" placeholder="Enter promoter's name" value="Rohan Sharma">

        <label for="store-location">Store Location & City</label>
        <input type="text" id="store-location" placeholder="e.g. Reliance Smart Bazaar, Mumbai" value="Reliance Retail - Mumbai">

        <label for="brand-name">Brand / Product</label>
        <input type="text" id="brand-name" value="Sunfeast Dark Fantasy">

        <label for="master-spiel">Master Brand Spiel (Golden Script)</label>
        <textarea id="master-spiel" rows="4">Namaste! Kya aapne Sunfeast Dark Fantasy try kiya hai? Isme hai crispy chocolate cookie bahar se aur andar molten choco lava jo muh mein melt ho jata hai. Aaj Reliance mein Buy 2 Get 1 Free offer chal raha hai, zaroor try kijiye!</textarea>

        <label for="interview-questions">Pre-Defined Evaluation Questions</label>
        <textarea id="interview-questions" rows="3">1. Self introduction (Name, age, experience, past brands)
2. Product USPs & why customers should buy
3. Handling customer objections in modern trade</textarea>

        <label for="gemini-api-key">Gemini API Key</label>
        <input type="password" id="gemini-api-key" placeholder="Enter your Gemini API key">
      </div>

      <!-- RIGHT COLUMN: VIDEO SUBMISSION & ACTIONS -->
      <div class="card">
        <h3>2. Candidate Video Submission</h3>
        
        <label for="video-input">Upload Candidate Pitch Video (.mp4, .mov, .webm)</label>
        <input type="file" id="video-input" accept="video/mp4,video/webm,video/quicktime,video/*">

        <div class="video-preview-box">
          <video id="video-player" controls style="display: none;"></video>
          <div id="video-placeholder" class="placeholder-text">
            No video selected. Upload a file to preview.
          </div>
        </div>

        <button id="evaluate-btn" class="btn btn-primary" onclick="runAIScreening()">
          🚀 Run AI Screening Assessment
        </button>
      </div>

    </div>

    <!-- EVALUATION RESULT CARD -->
    <div id="result-card" class="card result-card" style="display: none;">
      <div class="result-header">
        <h3>📊 AI Screening Assessment Report</h3>
        <span id="verdict-pill" class="badge-verdict"></span>
      </div>
      <div id="result-body"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
